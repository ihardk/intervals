name: interval
description: "A minimalist awareness & productivity logger for iOS and Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Database
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.9.0

  # Navigation
  go_router: ^13.0.0

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # Voice & Audio
  speech_to_text: ^6.6.0
  record: ^5.0.4
  audioplayers: ^5.2.1
  permission_handler: ^11.2.0

  # Charts & Visualization
  fl_chart: ^0.66.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  dartz: ^0.10.1
  share_plus: ^7.2.1
  shared_preferences: ^2.2.2
  csv: ^6.0.0

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Haptics
  vibration: ^1.8.4

  # Dependency Injection
  get_it: ^7.6.4

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  drift_dev: ^2.14.1
  build_runner: ^2.4.7
  freezed: ^2.4.7
  json_serializable: ^6.7.1

  # Testing
  mockito: ^5.4.4
  bloc_test: ^9.1.5

  # Linting
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets will be added as needed
  # assets:
  #   - assets/images/
  #   - assets/audio/
